services:
  api:
    image: ghcr.io/huliye24/emergenzix-api:${EMERGENZIX_VERSION:-0.1.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      EMERGENZIX_DB_PATH: /data/emergenzix.db
      EMERGENZIX_NOTIFICATION_DB_PATH: "${EMERGENZIX_NOTIFICATION_DB_PATH:-/data/notification-outbox.sqlite3}"
      EMERGENZIX_INITIAL_PAPER_CASH: "${EMERGENZIX_INITIAL_PAPER_CASH:-100000}"
      EMERGENZIX_MAX_ORDER_NOTIONAL: "${EMERGENZIX_MAX_ORDER_NOTIONAL:-5000}"
      EMERGENZIX_PAPER_FEE_BPS: "${EMERGENZIX_PAPER_FEE_BPS:-10}"
      EMERGENZIX_MARKET_DATA_CACHE_TTL_SECONDS: "${EMERGENZIX_MARKET_DATA_CACHE_TTL_SECONDS:-30}"
      EMERGENZIX_MARKET_DATA_CACHE_MAX_ENTRIES: "${EMERGENZIX_MARKET_DATA_CACHE_MAX_ENTRIES:-256}"
    volumes:
      - emergenzix-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/huliye24/emergenzix-web:${EMERGENZIX_VERSION:-0.1.0}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        EMERGENZIX_API_URL: http://api:8000
    restart: unless-stopped
    environment:
      EMERGENZIX_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true

  watch:
    image: ghcr.io/huliye24/emergenzix-api:${EMERGENZIX_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "emergenzix_api.watch_agent"]
    environment:
      EMERGENZIX_WATCH_EXCHANGE: "${EMERGENZIX_WATCH_EXCHANGE:-binance}"
      EMERGENZIX_WATCH_SYMBOL: "${EMERGENZIX_WATCH_SYMBOL:-BTCUSDT}"
      EMERGENZIX_WATCH_TIMEFRAME: "${EMERGENZIX_WATCH_TIMEFRAME:-4h}"
      EMERGENZIX_WATCH_LIMIT: "${EMERGENZIX_WATCH_LIMIT:-200}"
      EMERGENZIX_WATCH_LOOKBACK: "${EMERGENZIX_WATCH_LOOKBACK:-20}"
      EMERGENZIX_WATCH_INTERVAL_SECONDS: "${EMERGENZIX_WATCH_INTERVAL_SECONDS:-300}"
      EMERGENZIX_WATCH_STATE_PATH: /data/watch-state.json
      EMERGENZIX_OPERATIONAL_ALERT_STATE_PATH: "${EMERGENZIX_OPERATIONAL_ALERT_STATE_PATH:-/data/operational-alert-state.json}"
      EMERGENZIX_NOTIFICATION_BACKLOG_THRESHOLD: "${EMERGENZIX_NOTIFICATION_BACKLOG_THRESHOLD:-20}"
      EMERGENZIX_NOTIFICATION_DB_PATH: "${EMERGENZIX_NOTIFICATION_DB_PATH:-/data/notification-outbox.sqlite3}"
      EMERGENZIX_TELEGRAM_REQUIRED: "${EMERGENZIX_TELEGRAM_REQUIRED:-true}"
      EMERGENZIX_TELEGRAM_BOT_TOKEN: "${EMERGENZIX_TELEGRAM_BOT_TOKEN:-}"
      EMERGENZIX_TELEGRAM_CHAT_ID: "${EMERGENZIX_TELEGRAM_CHAT_ID:-}"
    volumes:
      - emergenzix-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  telegram-bot:
    image: ghcr.io/huliye24/emergenzix-api:${EMERGENZIX_VERSION:-0.1.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["telegram"]
    restart: on-failure:5
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "emergenzix_api.telegram_bot"]
    environment:
      EMERGENZIX_TELEGRAM_BOT_TOKEN: "${EMERGENZIX_TELEGRAM_BOT_TOKEN:-}"
      EMERGENZIX_TELEGRAM_ALLOWED_CHAT_ID: "${EMERGENZIX_TELEGRAM_ALLOWED_CHAT_ID:-}"
      EMERGENZIX_TELEGRAM_API_BASE_URL: "http://api:8000"
      EMERGENZIX_TELEGRAM_BOT_STATE_PATH: /data/telegram-bot-state.json
      EMERGENZIX_DB_PATH: /data/emergenzix.db
      EMERGENZIX_TELEGRAM_BATCH_ENABLED: "${EMERGENZIX_TELEGRAM_BATCH_ENABLED:-false}"
      EMERGENZIX_TELEGRAM_POLL_TIMEOUT_SECONDS: "${EMERGENZIX_TELEGRAM_POLL_TIMEOUT_SECONDS:-25}"
      EMERGENZIX_TELEGRAM_BACKTEST_COOLDOWN_SECONDS: "${EMERGENZIX_TELEGRAM_BACKTEST_COOLDOWN_SECONDS:-60}"
    volumes:
      - emergenzix-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  emergenzix-data:
    name: emergenzix-data
