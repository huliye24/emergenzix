name: Release containers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish versioned container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/huliye24/emergenzix-api
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Prepare web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/huliye24/emergenzix-web
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            EMERGENZIX_API_URL=http://api:8000

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Emergenzix ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Container images published for ${{ github.ref_name }}:
            - ghcr.io/huliye24/emergenzix-api:${{ github.ref_name }}
            - ghcr.io/huliye24/emergenzix-web:${{ github.ref_name }}

            AWS deployment remains a separate operator-controlled step. The current API has no authentication; do not expose it publicly until the deployment and access-control design is reviewed.
