name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Strategy signal-contract tests exercise pandas without running Freqtrade.
          python -m pip install "pandas>=2.2,<3.0"

      - name: Compile Python modules
        run: python -m compileall -q emergenzix_api emergenzix_gpu_lab tests

      - name: Run API tests
        run: pytest -q

      - name: Validate optional GPU Compose profile without a GPU
        working-directory: .
        run: docker compose --profile gpu config --quiet

      - name: Validate Freqtrade research and public-data profiles (no containers started)
        working-directory: .
        run: |
          docker compose -f ops/freqtrade/docker-compose.research.yml \
            --profile freqtrade-research --profile freqtrade-download config --quiet

